listen=YES
listen_ipv6=NO
background=NO

# Allow anonymous FTP
anonymous_enable=NO

# Allow local users to log in
local_enable=YES

# Enable write
write_enable=YES

# Local users will be put into a chroot jail
chroot_local_user=YES
allow_writeable_chroot=YES

# Enable logging
xferlog_enable=YES
xferlog_std_format=YES
xferlog_file=/var/log/vsftpd.log

# Passive FTP settings
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30009
pasv_address=0.0.0.0

# Enable upload/download resume
ascii_upload_enable=YES
ascii_download_enable=YES

# Banner displayed when someone connects to the server
ftpd_banner=Welcome to the FTP Server for Inquisitor Project Testing

# Enables the use of the PASV command
pasv_promiscuous=YES
port_promiscuous=YES

# Uncomment this to indicate that vsftpd use a utf8 filesystem
utf8_filesystem=YES

# Set the umask for file creation
local_umask=022

# Active mode settings
connect_from_port_20=YES
ftp_data_port=20

# Don't check for valid shell
check_shell=NO